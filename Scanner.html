<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BERKAH KURBAN - Scanner QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--green:#166534;--dark:#14532d;--bg:#f4f7f5;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .wrap{max-width:560px;margin:auto;padding:18px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.07)}
    h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
    .head{text-align:center;margin-bottom:16px}
    #reader{width:100%;overflow:hidden;border-radius:16px}
    .frame{margin:14px 0;border:2px solid var(--green);border-radius:18px;padding:8px;background:#f0fdf4}
    .status{padding:11px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:13px;line-height:1.45}
    .success{background:#f0fdf4;border-color:#bbf7d0;color:var(--dark);font-weight:800}
    button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}
    .primary{background:var(--green);color:#fff}.secondary{background:#eef2f7;color:#111827}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
    .coupon{font-size:27px;font-weight:900;letter-spacing:3px;margin-top:5px}
    .small{font-size:11px;color:var(--muted)}
    .warn{margin-top:10px;padding:11px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div style="font-size:30px">📷</div>
      <h1>Scanner QR BERKAH KURBAN</h1>
      <div class="sub">Mushola At Taubah</div>
    </div>

    <div class="frame">
      <div id="reader"></div>
    </div>

    <div id="status" class="status">Tekan <strong>Mulai Kamera</strong>, lalu izinkan akses kamera.</div>

    <div id="result" style="display:none;margin-top:12px;text-align:center">
      <div class="small">NOMOR KUPON</div>
      <div id="coupon" class="coupon">—</div>
    </div>

    <div class="actions">
      <button class="primary" id="startBtn" onclick="startCamera()">📷 Mulai Kamera</button>
      <button class="secondary" id="stopBtn" onclick="stopCamera()">⏹ Berhenti</button>
      <button class="secondary" onclick="window.close()">Tutup</button>
    </div>

    <div class="warn">
      Gunakan kamera belakang HP. Pastikan seluruh QR terlihat jelas, cukup terang, dan tidak tertutup pantulan.
    </div>
  </div>
</div>

<script>
let scanner = null;
let running = false;
let sent = false;

function setStatus(msg, good=false){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className='status'+(good?' success':'');
}

async function startCamera(){
  if(running) return;
  sent = false;

  if(typeof Html5Qrcode === 'undefined'){
    setStatus('Library scanner belum termuat. Periksa koneksi internet.');
    return;
  }

  scanner = new Html5Qrcode('reader');

  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:250,height:250}},
      onScanSuccess,
      () => {}
    );
    running=true;
    setStatus('Kamera aktif. Arahkan kotak QR ke tiket.');
  }catch(err){
    running=false;
    setStatus('Kamera tidak dapat dibuka. Pastikan izin kamera browser = Allow dan buka halaman ini melalui HTTPS. Detail: '+err);
  }
}

async function stopCamera(){
  if(!scanner || !running) return;
  try{await scanner.stop();}catch(e){}
  try{await scanner.clear();}catch(e){}
  running=false;
  setStatus('Kamera dihentikan.');
}

async function onScanSuccess(decodedText){
  if(sent) return;
  sent = true;

  let coupon=String(decodedText||'').trim();
  if(coupon.toUpperCase().indexOf('BERKAH-KURBAN|')===0){
    coupon=coupon.substring('BERKAH-KURBAN|'.length);
  }

  document.getElementById('coupon').textContent=coupon;
  document.getElementById('result').style.display='block';
  setStatus('QR berhasil dibaca. Mengirim '+coupon+' ke aplikasi utama…', true);

  if(window.opener){
    window.opener.postMessage(
      {type:'BERKAH_KURBAN_QR', coupon:coupon},
      '*'
    );
    try{await stopCamera();}catch(e){}
    setTimeout(()=>{ try{window.close();}catch(e){} }, 500);
  }else{
    setStatus('QR terbaca: '+coupon+'. Buka scanner ini dari tombol Scan QR di aplikasi BERKAH KURBAN.', true);
  }
}

window.addEventListener('beforeunload', ()=>{ try{stopCamera();}catch(e){} });
</script>
</body>
</html>
